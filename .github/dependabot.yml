version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # pytest is pinned by pytest-homeassistant-custom-component; it gets
      # bumped together with that package, standalone updates never resolve.
      - dependency-name: pytest
