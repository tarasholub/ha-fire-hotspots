name: Lint & Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout Repo
        uses: actions/checkout@v7

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: 📦 Install dependencies
        run: uv sync --locked --dev

      - name: ⚙️ Lint
        run: uv run pre-commit run --all-files

      - name: 🧪 Test
        run: uv run pytest
