blueprint:
  name: "Fire Hotspots: notify about hotspots near a zone"
  description: >-
    Send a mobile notification when new fire hotspots are detected within
    the radius of a watched zone (configure watch zones in the Fire
    Hotspots options first).
  domain: automation
  source_url: https://github.com/tarasholub/ha-fire-hotspots/blob/main/blueprints/automation/fire_hotspots/zone_hotspots_notify.yaml
  input:
    event_entity:
      name: New hotspots event
      description: The "New hotspots" event entity of a Fire Hotspots entry.
      selector:
        entity:
          filter:
            - integration: fire_hotspots
              domain: event
    zone_entity:
      name: Zone
      description: React only to this zone. Leave empty for all watched zones.
      default: ""
      selector:
        entity:
          filter:
            - domain: zone
    notify_device:
      name: Device to notify
      description: A device with the Home Assistant Companion app.
      selector:
        device:
          filter:
            - integration: mobile_app

mode: queued
max: 10

triggers:
  - trigger: state
    entity_id: !input event_entity
    not_to:
      - unknown
      - unavailable

variables:
  zone_filter: !input zone_entity
  nearest: >-
    {{ trigger.to_state.attributes.detections
       | map(attribute='distance') | reject('none') | list | first | default(none) }}

conditions:
  - condition: template
    value_template: >-
      {{ trigger.to_state.attributes.event_type == 'detected_near_zone'
         and (zone_filter in ('', none)
              or trigger.to_state.attributes.zone == zone_filter) }}

actions:
  - domain: mobile_app
    type: notify
    device_id: !input notify_device
    title: "🔥 {{ trigger.to_state.attributes.zone_name }}"
    message: >-
      New hotspots near the zone: {{ trigger.to_state.attributes.count }}{% if nearest is not none %},
      nearest {{ nearest }} km from its centre{% endif %}.
